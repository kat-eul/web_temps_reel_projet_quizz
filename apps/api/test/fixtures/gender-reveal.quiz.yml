quiz:
  title: "Gender Reveal de Julie & Thomas"
  description: "Quiz famille"
  theme: pastel

  settings:
    max_players: 10
    mode: individual
    show_answers: manual

teams:
  enabled: false

questions:
  - id: q1
    title: "Les parents pensent-ils avoir une fille ?"
    points: 1
    answer:
      mode: boolean
      value: true

  - id: q2
    title: "Quels prénoms ont été envisagés ?"
    points: 2
    answer:
      mode: choice
      multiple: true
      options:
        - text: "Emma"
          correct: true
        - text: "Louise"
          correct: true
        - text: "Alice"
          correct: false

  # Démonstration du découplage média/réponse : une photo (media) avec une
  # réponse à choix (answer.mode: choice) plutôt qu'en texte libre.
  - id: q3
    title: "Qui est ce bébé ?"
    points: 2
    media:
      type: image
      source: "./images/bebe.jpg"
    answer:
      mode: choice
      options:
        - text: "Papa"
          correct: true
        - text: "Maman"
          correct: false

  - id: q4
    title: "Quel prénom pensez-vous que les parents ont choisi ?"
    points: 3
    answer:
      mode: text
      correction: automatic
      accepted: ["Léa", "Lea"]
      fuzzy_matching: true

  - id: q5
    title: "Quel sera le poids du bébé (en grammes) ?"
    points: 3
    answer:
      mode: number
      range:
        min: 2000
        max: 5000
      value: 3500
      tolerance: 200

  # Blindtest : media YouTube + réponse à choix
  - id: q6
    title: "Quelle est cette chanson ?"
    points: 2
    media:
      type: youtube
      url: "https://youtube.com/xxxxx"
      clip:
        start: 35
        duration: 15
    answer:
      mode: choice
      options:
        - text: "Thriller"
          correct: true
        - text: "Billie Jean"
          correct: false
